<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — eDESK Print &amp; Digital</title>
    <script src="js/manifest-init.js"></script>
    <link rel="icon" href="assets/icon-192.png">
    <meta name="theme-color" content="#101B30">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="assets/logo.png" alt="eDESK Stationery">
                <div class="t1">eDESK Print &amp; Digital</div>
                <div class="t2">Print &amp; Digital</div>
            </div>
            <div class="auth-title">Reset your password</div>
            <p class="auth-sub" id="stepSub">Enter your username to begin</p>

            <div class="error-box" id="err"></div>

            <!-- Step 1: find username -->
            <form id="step1Form">
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Continue</button>
            </form>

            <!-- Step 2: answer + new password -->
            <form id="step2Form" class="hidden">
                <div class="field">
                    <label id="questionLabel">Security Question</label>
                    <input type="text" id="answer" required placeholder="Your answer">
                </div>
                <div class="field">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                <div class="field">
                    <label>Confirm New Password</label>
                    <input type="password" id="newPassword2" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-full">Reset Password</button>
            </form>

            <p class="auth-alt"><a href="login.html">&larr; Back to log in</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const err = document.getElementById('err');
        let username = '';

        document.getElementById('step1Form').addEventListener('submit', async(e) => {
            e.preventDefault();
            err.classList.remove('show');
            username = document.getElementById('username').value.trim();

            const res = await API.auth('forgot_password.php', {
                step: 'find',
                username
            });
            if (!res.success) {
                err.textContent = res.message;
                err.classList.add('show');
                return;
            }
            document.getElementById('questionLabel').textContent = res.data.security_question;
            document.getElementById('step1Form').classList.add('hidden');
            document.getElementById('step2Form').classList.remove('hidden');
            document.getElementById('stepSub').textContent = 'Answer your security question';
        });

        document.getElementById('step2Form').addEventListener('submit', async(e) => {
            e.preventDefault();
            err.classList.remove('show');

            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('newPassword2').value;
            if (p1 !== p2) {
                err.textContent = 'New passwords do not match.';
                err.classList.add('show');
                return;
            }

            const res = await API.auth('forgot_password.php', {
                step: 'reset',
                username,
                security_answer: document.getElementById('answer').value.trim(),
                new_password: p1,
            });

            if (!res.success) {
                err.textContent = res.message;
                err.classList.add('show');
                return;
            }
            toast('Password reset. Please log in.');
            setTimeout(() => window.location.href = 'login.html', 1200);
        });
    </script>
</body>

</html>
