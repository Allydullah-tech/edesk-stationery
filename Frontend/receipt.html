<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt — eDESK Print &amp; Digital</title>
    <link rel="icon" href="assets/icon-192.png">
    <meta name="theme-color" content="#101B30">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /*
    A receipt is a different shape of document from the rest of the app's
    "business report" printouts (sales/products/etc), so it gets its own
    small, self-contained layout here rather than reusing the wide report
    CSS in style.css. This width (80mm-equivalent) prints cleanly on a
    thermal receipt printer; on a normal A4/A5 printer it prints centered
    with blank margin either side, which is the standard look for a
    receipt-style printout on regular paper too.
  */
        
        body {
            background: #EEF0F5;
        }
        
        .receipt-page {
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
        }
        
        .receipt-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        .receipt-paper {
            background: #fff;
            max-width: 320px;
            margin: 0 auto;
            padding: 20px 18px;
            font-family: 'Courier New', monospace;
            font-size: 12.5px;
            color: #101B30;
            box-shadow: 0 2px 10px rgba(16, 27, 48, .12);
            border-radius: 4px;
        }
        
        .receipt-paper .center {
            text-align: center;
        }
        
        .receipt-paper .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            display: block;
            margin: 0 auto 0px;
        }

        .receipt-paper .shop-tagline {
            font-size: 14px;
            color: var(--gold);
            font-weight: 900;
            letter-spacing: .5px;
            margin-top: -20px;
        }
        
        .receipt-paper .shop-meta {
            font-size: 10.5px;
            color: #4B5468;
            margin-top: 4px;
        }
        
        .receipt-paper hr {
            border: none;
            border-top: 1px dashed #9aa3b5;
            margin: 10px 0;
        }
        
        .receipt-paper .row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 2px 0;
        }
        
        .receipt-paper .row .k {
            color: #4B5468;
        }
        
        .receipt-paper .item-row {
            margin: 8px 0;
        }
        
        .receipt-paper .item-name {
            font-weight: 700;
        }
        
        .receipt-paper .totals .row {
            font-size: 13px;
        }
        
        .receipt-paper .grand-total {
            font-size: 15px;
            font-weight: 800;
            border-top: 1px dashed #9aa3b5;
            padding-top: 6px;
            margin-top: 6px;
        }
        
        .receipt-paper .footer-note {
            margin-top: 14px;
            font-size: 10.5px;
            color: #4B5468;
            text-align: center;
        }
        
        .receipt-paper .receipt-id {
            font-size: 10.5px;
            color: #4B5468;
        }
        
        .not-found {
            max-width: 400px;
            margin: 60px auto;
            text-align: center;
            color: #4B5468;
        }
        
        @media print {
            body {
                background: #fff;
            }
            .receipt-page {
                margin: 0;
                padding: 0;
            }
            .receipt-paper {
                box-shadow: none;
                border-radius: 0;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

    <div class="receipt-page">
        <div class="receipt-actions no-print">
            <button class="btn btn-outline btn-sm" onclick="window.close(); window.location.href='sales.html';">&larr; Back to Sales</button>
            <button class="btn btn-primary btn-sm" onclick="window.print()"><svg class="ui-icon"><use href="assets/icons.svg#download"></use></svg> Print / Save as PDF</button>
        </div>

        <div id="receiptContent"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/receipt.js"></script>
</body>

</html>
